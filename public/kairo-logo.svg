<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c2882" />
      <stop offset="45%" stop-color="#673ab7" />
      <stop offset="100%" stop-color="#3b1d6e" />
    </linearGradient>

    <linearGradient id="wingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5c389e" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="bookLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="bookRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="60%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <linearGradient id="sakuraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Subtle Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e1b4b" flood-opacity="0.18" />
    </filter>
    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Group for Logo Mark -->
  <g filter="url(#shadow)" id="kairo-emblem">
    <!-- Open Book Base Pages (Left) -->
    <path d="M 200 280 C 170 285, 120 288, 70 270 C 60 266, 50 273, 52 284 C 54 294, 62 298, 74 302 C 120 318, 170 310, 200 298 Z" 
          fill="url(#bookLeft)" />
    <!-- Secondary Left Page Layer -->
    <path d="M 200 287 C 165 292, 115 293, 76 280 C 85 284, 135 303, 200 293 Z" 
          fill="#3b82f6" opacity="0.6" />

    <!-- Open Book Base Pages (Right) -->
    <path d="M 200 280 C 230 285, 280 288, 330 270 C 340 266, 350 273, 348 284 C 346 294, 338 298, 326 302 C 280 318, 230 310, 200 298 Z" 
          fill="url(#bookRight)" />
    <!-- Secondary Right Page Layer -->
    <path d="M 200 287 C 235 292, 285 293, 324 280 C 315 284, 265 303, 200 293 Z" 
          fill="#38bdf8" opacity="0.7" />

    <!-- Book Spine Glow Center -->
    <ellipse cx="200" cy="294" rx="14" ry="4" fill="#673ab7" />

    <!-- Stylized 'K' - Left Vertical Upright Stem -->
    <!-- Elegantly bracketed serif head and curving base -->
    <path d="M 125 78 C 120 78, 108 76, 98 72 C 94 70, 92 74, 94 77 C 98 83, 108 92, 115 97 L 115 272 C 108 277, 98 285, 94 291 C 92 294, 94 298, 98 296 C 110 292, 125 290, 140 290 C 155 290, 170 292, 182 296 C 186 298, 188 294, 186 291 C 182 285, 172 277, 165 272 L 165 97 C 172 92, 182 83, 186 77 C 188 74, 186 70, 182 72 C 170 76, 155 78, 140 78 Z" 
          fill="url(#stemGrad)" />

    <!-- Stylized 'K' - Upper Diagonal Arm (Swooping Wing to Sky) -->
    <path d="M 148 185 C 165 160, 205 110, 265 80 C 285 70, 305 68, 316 71 C 319 72, 319 76, 316 78 C 300 88, 265 115, 235 155 C 205 195, 180 215, 155 218 Z" 
          fill="url(#wingGrad)" />

    <!-- Stylized 'K' - Lower Diagonal Leg (Curving to Page) -->
    <path d="M 172 178 C 190 190, 215 215, 238 245 C 255 268, 275 282, 305 288 C 310 289, 311 294, 307 296 C 290 302, 260 298, 235 280 C 208 260, 185 230, 160 205 Z" 
          fill="url(#wingGrad)" opacity="0.95" />

    <!-- Central Glowing Pink Heart nestled in the K cleft -->
    <g transform="translate(195, 165) scale(0.95)" filter="url(#glowPink)">
      <path d="M 0 8 C -14 -12, -32 -4, -32 14 C -32 28, -12 44, 0 54 C 12 44, 32 28, 32 14 C 32 -4, 14 -12, 0 8 Z" 
            fill="url(#heartGrad)" />
      <!-- Heart Inner Specular Highlight -->
      <path d="M -8 6 C -18 -6, -26 -1, -26 12 C -26 18, -18 26, -10 32 C -13 24, -14 16, -12 10 C -11 7, -9 6, -8 6 Z" 
            fill="#ffffff" opacity="0.45" />
    </g>

    <!-- Sakura (Cherry Blossom) Flower - Upper Right Branch -->
    <g transform="translate(292, 105) scale(0.85)">
      <!-- 5 Delicate Petals -->
      <!-- Petal 1 (Top) -->
      <path d="M 0 0 C -6 -14, -8 -26, 0 -30 C 8 -26, 6 -14, 0 0 Z" fill="url(#sakuraGrad)" />
      <!-- Petal 2 (Top Right) -->
      <path d="M 0 0 C 10 -12, 24 -14, 28 -7 C 26 2, 12 6, 0 0 Z" fill="url(#sakuraGrad)" />
      <!-- Petal 3 (Bottom Right) -->
      <path d="M 0 0 C 14 6, 22 18, 16 25 C 9 26, 2 14, 0 0 Z" fill="url(#sakuraGrad)" />
      <!-- Petal 4 (Bottom Left) -->
      <path d="M 0 0 C -4 14, -14 24, -22 20 C -24 12, -12 4, 0 0 Z" fill="url(#sakuraGrad)" />
      <!-- Petal 5 (Top Left) -->
      <path d="M 0 0 C -14 4, -26 -4, -25 -13 C -18 -18, -8 -8, 0 0 Z" fill="url(#sakuraGrad)" />
      <!-- Blossom Center Pistil -->
      <circle cx="0" cy="0" r="4.5" fill="#fbcfe8" />
      <circle cx="0" cy="0" r="2.5" fill="#db2777" />
    </g>

    <!-- Floating / Fluttering Cherry Blossom Petals -->
    <!-- Petal A -->
    <path d="M 324 140 C 330 134, 338 136, 340 142 C 342 148, 334 154, 328 152 C 322 150, 320 144, 324 140 Z" 
          fill="#f47fa5" opacity="0.85" transform="rotate(-15 330 145)" />
    <!-- Petal B -->
    <path d="M 305 180 C 312 174, 320 178, 320 184 C 320 190, 310 196, 304 192 C 298 188, 300 182, 305 180 Z" 
          fill="#fb7185" opacity="0.9" transform="rotate(25 312 185)" />
    <!-- Petal C (Lower) -->
    <path d="M 285 220 C 290 216, 296 218, 298 223 C 300 228, 294 233, 289 231 C 284 229, 282 224, 285 220 Z" 
          fill="#fda4af" opacity="0.8" transform="rotate(-35 290 225)" />
  </g>

  <!-- Typography: K A I R O -->
  <text x="200" y="380" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, 'Montserrat', 'Inter', sans-serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="14" 
        fill="#1e1435">
    KAIRO
  </text>

  <!-- Tagline: STORIES. FANDOMS. HEARTS. -->
  <g transform="translate(200, 420)" 
     font-family="system-ui, -apple-system, 'Inter', sans-serif" 
     font-size="13" 
     font-weight="800" 
     letter-spacing="3" 
     text-anchor="middle">
    <text x="-96" y="0" fill="#2d2247">STORIES.</text>
    <text x="3" y="0" fill="#ec4899">FANDOMS.</text>
    <text x="98" y="0" fill="#0284c7">HEARTS.</text>
  </g>
</svg>
